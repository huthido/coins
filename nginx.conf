server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Service worker và manifest: không cache lâu để bản cập nhật đến người dùng ngay
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Cache tài nguyên tĩnh 1 giờ (app là file tĩnh, dữ liệu lấy trực tiếp từ API phía client)
    location ~* \.(css|js|png)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy cùng origin cho endpoint có ký của Binance (trình duyệt bị chặn CORS
    # khi gọi thẳng). Server chỉ chuyển tiếp nguyên vẹn — không đọc, không lưu khóa.
    location /xapi/ {
        proxy_pass https://api.binance.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.binance.com;
        proxy_buffering off;
    }
    location /xapi-testnet/ {
        proxy_pass https://testnet.binance.vision/;
        proxy_ssl_server_name on;
        proxy_set_header Host testnet.binance.vision;
        proxy_buffering off;
    }
}
