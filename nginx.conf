server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Service worker và manifest: không cache lâu để bản cập nhật đến người dùng ngay
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Cache tài nguyên tĩnh 1 giờ (app là file tĩnh, dữ liệu lấy trực tiếp từ API phía client)
    location ~* \.(css|js|png)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
